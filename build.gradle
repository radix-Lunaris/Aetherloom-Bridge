plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'online.superyk7hero.aetherloom'
version = '0.1.0'
base { archivesName = 'aetherloom-bridge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.22' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy('reobfJar')
tasks.register('fixtureJar', Jar) {
    dependsOn testClasses
    archiveClassifier = 'fixture'
    from sourceSets.test.output
}
reobf { fixtureJar {} }
fixtureJar.finalizedBy('reobfFixtureJar')

// Keep the GPL notice inside the normal Mod artifact.
jar { from("LICENSE") { into("META-INF") } }
